spring.application.name=spring-boot-hibernate

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/ticket
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Entity scanning - ADD THIS CRUCIAL LINE
spring.jpa.entity-scan.packages=com.example.hibernate.model
